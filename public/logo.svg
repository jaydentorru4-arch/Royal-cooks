<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background matches user image dark warm charcoal/brown-black -->
  <rect width="500" height="500" fill="#1C1815"/>

  <g transform="translate(10, 8)">
    <!-- 1. Skillet Pan & Leaping Flames (White #FFFFFF) with exact internal cutout -->
